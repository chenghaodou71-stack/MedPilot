server:
  port: 8080

spring:
  application:
    name: medpilot-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      url: ${MEDPILOT_REDIS_URL:redis://127.0.0.1:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "20260810.06"
    baseline-description: pre-flyway production schema
    validate-migration-naming: true

medpilot:
  ai-service-url: ${MEDPILOT_AI_SERVICE_URL:http://127.0.0.1:8000}
  ai-service-token: ${MEDPILOT_AI_SERVICE_TOKEN}
  ai-connect-timeout-ms: ${MEDPILOT_AI_CONNECT_TIMEOUT_MS:3000}
  ai-response-timeout-seconds: ${MEDPILOT_AI_RESPONSE_TIMEOUT_SECONDS:120}
  data-encryption-key: ${MEDPILOT_DATA_ENCRYPTION_KEY}
  attachments:
    # Prefer the documented plural variable; keep the old singular name as a
    # compatibility fallback for existing local installations.
    storage-dir: ${MEDPILOT_ATTACHMENTS_STORAGE_DIR:${MEDPILOT_ATTACHMENT_DIR:./var/private/attachments}}
    retention-days: ${MEDPILOT_ATTACHMENTS_RETENTION_DAYS:${MEDPILOT_ATTACHMENT_RETENTION_DAYS:30}}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  identity:
    # Production starts fail-closed for local credentials. Hospital OIDC/SAML
    # adapters must bind external subjects to pre-approved local accounts.
    local-password-login-enabled: ${MEDPILOT_LOCAL_PASSWORD_LOGIN_ENABLED:false}
    oidc:
      enabled: ${MEDPILOT_OIDC_ENABLED:false}
      issuer-uri: ${MEDPILOT_OIDC_ISSUER_URI:}
      # Set the exact resource-server audience issued by the hospital IdP.
      # OIDC startup fails closed when this value is absent.
      audience: ${MEDPILOT_OIDC_AUDIENCE:}
      # Optional explicit JWK endpoint. Leave blank to use issuer discovery.
      jwk-set-uri: ${MEDPILOT_OIDC_JWK_SET_URI:}
      mfa-claim: ${MEDPILOT_OIDC_MFA_CLAIM:acr}
      required-mfa-assurance-level: ${MEDPILOT_OIDC_REQUIRED_MFA_ASSURANCE_LEVEL:2}
      allow-insecure-http: ${MEDPILOT_OIDC_ALLOW_INSECURE_HTTP:false}
  redis:
    enabled: ${MEDPILOT_REDIS_ENABLED:true}
    required: ${MEDPILOT_REDIS_REQUIRED:true}
    key-prefix: ${MEDPILOT_REDIS_KEY_PREFIX:medpilot}
    # Keep the key derivation secret separate in production. The final
    # property fallback keeps local/test profiles resolvable without relying
    # on an environment variable that may not be present.
    key-hmac-secret: ${MEDPILOT_REDIS_KEY_HMAC_SECRET:${MEDPILOT_AI_SERVICE_TOKEN:${medpilot.ai-service-token:}}}
