spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/medpilot?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update

medpilot:
  ai-service-token: ${MEDPILOT_AI_SERVICE_TOKEN:medpilot-dev-service-token}
  data-encryption-key: ${MEDPILOT_DATA_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  jwt:
    secret: ${JWT_SECRET:medpilot-dev-jwt-secret-0123456789abcdef}
    cookie-secure: false
